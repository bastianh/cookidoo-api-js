# Spins up a stock Node-RED for manual, interactive testing of this repo's
# nodes against a real account -- no publishing, no custom image required.
#
# `cookidoo-api-js`, `@bastianh/node-red-cookidoo` and `@bastianh/node-red-fcm`
# are bind-mounted straight from the working tree into /data/node_modules, in
# the same layout `npm` would produce (the scoped ones under their npm scope's
# own subfolder), so Node's module resolution finds `cookidoo-api-js` from
# within the Node-RED package without either package needing to be published.
# Node-RED discovers any node module dropped into its user directory's
# node_modules on startup (scoped packages included), no entry in
# /data/package.json required.
#
# `@bastianh/node-red-fcm` also has a third-party dependency
# (@eneris/push-receiver), which needs one more mount. Its own node_modules is
# a directory of pnpm symlinks pointing at ../../../../node_modules/.pnpm/...
# -- four levels up from packages/node-red-fcm/node_modules/<scope>/ is the
# repo root. The container path is the same four levels deep, so those same
# relative links land on /data/node_modules/node_modules/.pnpm, which is why
# the pnpm store is mounted there. (Node-RED ignores that extra `node_modules`
# directory when scanning for nodes -- it has no package.json.)
#
# One-off manual testing:
#   pnpm --filter cookidoo-api-js build   # dist/ must exist first
#   docker compose up
#   open http://localhost:1880
#
# Node code is only loaded at startup, so after rebuilding run:
#   docker compose restart
#
# Active development, with auto-reload on every change (two terminals):
#   pnpm --filter cookidoo-api-js dev     # tsup --watch, rebuilds dist/ on src/ changes
#   pnpm dev:node-red                     # brings this stack up and restarts it on dist/ or nodes/ changes
#
# (`docker compose watch` looks like the built-in fit for this, but its sync
# step writes into these bind-mounted paths, which -- since a bind mount
# reflects a container write straight back to the host -- retriggers the
# same watcher and restart-loops. `pnpm dev:node-red` (scripts/watch-node-red.mjs)
# just watches and calls `docker compose restart`, no file syncing involved.)
#
# This is for local, unauthenticated manual testing only -- do not expose
# port 1880 beyond your machine.

services:
  node-red:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
      - ./packages/cookidoo-api-js/dist:/data/node_modules/cookidoo-api-js/dist:ro
      - ./packages/cookidoo-api-js/package.json:/data/node_modules/cookidoo-api-js/package.json:ro
      - ./packages/node-red-cookidoo/nodes:/data/node_modules/@bastianh/node-red-cookidoo/nodes:ro
      - ./packages/node-red-cookidoo/package.json:/data/node_modules/@bastianh/node-red-cookidoo/package.json:ro
      - ./packages/node-red-fcm/nodes:/data/node_modules/@bastianh/node-red-fcm/nodes:ro
      - ./packages/node-red-fcm/package.json:/data/node_modules/@bastianh/node-red-fcm/package.json:ro
      - ./packages/node-red-fcm/node_modules:/data/node_modules/@bastianh/node-red-fcm/node_modules:ro
      - ./node_modules/.pnpm:/data/node_modules/node_modules/.pnpm:ro

volumes:
  node_red_data:
