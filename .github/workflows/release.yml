name: Release

# Two-phase changesets release, using npm's Trusted Publishing (OIDC) so no
# NPM_TOKEN secret is needed for the actual `npm publish` calls:
#   1. select-mode decides, from the presence of pending changesets, whether
#      this run should open/update a "Version Packages" PR or publish.
#   2. version opens/updates that PR (merging it is what triggers a publish
#      run on the next push to main).
#   3. publish runs once the version PR has been merged (no changesets left
#      pending), builds, and publishes every bumped package.
#
# One-time setup this workflow depends on and can't do itself:
#   - Each package needs a first, manual `npm publish` (trusted publishing
#     can only be configured for a package that already exists on npm).
#   - After that, add this workflow as a Trusted Publisher for each package
#     on npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions
#     -> org/user "bastianh", repo "cookidoo-api-js", workflow filename
#     "release.yml").
#   - Repo setting "Allow GitHub Actions to create and approve pull
#     requests" (Settings -> Actions -> General) must be enabled for the
#     version job to open its PR.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/select-mode@v2
        id: select-mode

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/version@v2
        id: version

  publish:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs Node >=22.14 / npm >=11.5.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - uses: changesets/action/publish@v2
