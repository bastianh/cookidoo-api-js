<script type="text/javascript">
  RED.nodes.registerType("cookidoo-config", {
    category: "config",
    defaults: {
      name: { value: "" },
      countryCode: { value: "ch", required: true },
      language: { value: "de-CH", required: true },
      localizationUrl: { value: "https://cookidoo.ch/foundation/de-CH", required: true },
    },
    credentials: {
      email: { type: "text" },
      // Set only by the Login button below (via the /login admin route) or
      // by the node's own token-refresh callback -- never edited directly.
      authData: { type: "password" },
    },
    label: function () {
      return this.name || `cookidoo (${this.countryCode}/${this.language})`;
    },
    oneditprepare: function () {
      const node = this;
      const select = $("#node-config-input-localization");
      $.getJSON("cookidoo-api-js/localizations", (options) => {
        select.empty();
        for (const option of options) {
          select.append(
            $("<option>")
              .val(`${option.countryCode}|${option.language}|${option.url}`)
              .text(`${option.countryCode} - ${option.language}`),
          );
        }
        select.val(`${node.countryCode}|${node.language}|${node.localizationUrl}`);
      });
      select.on("change", () => {
        const [countryCode, language, url] = select.val().split("|");
        $("#node-config-input-countryCode").val(countryCode);
        $("#node-config-input-language").val(language);
        $("#node-config-input-localizationUrl").val(url);
      });

      const statusEl = $("#node-config-login-status");
      statusEl.text(node.credentials.authData ? "✓ logged in" : "not logged in yet").css(
        "color",
        node.credentials.authData ? "green" : "#888",
      );

      $("#node-config-login-button").on("click", function (evt) {
        evt.preventDefault();
        const email = $("#node-config-input-email").val();
        const password = $("#node-config-input-login-password").val();
        const [countryCode, language, localizationUrl] = select.val().split("|");

        if (!email || !password) {
          statusEl.text("Enter email and password first.").css("color", "red");
          return;
        }

        statusEl.text("Logging in...").css("color", "#888");
        $.ajax({
          url: "cookidoo-api-js/login",
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify({
            id: node.id,
            email,
            password,
            countryCode,
            language,
            localizationUrl,
          }),
        })
          .done(() => {
            // The tokens are live immediately, but Node-RED only writes
            // credentials to disk as part of a Deploy -- without one, they're
            // gone the next time this process restarts.
            statusEl.text("✓ Logged in -- click Deploy to save the tokens").css("color", "green");
            $("#node-config-input-login-password").val("");
          })
          .fail((jqXHR) => {
            const message = jqXHR.responseJSON?.message || "Login failed.";
            statusEl.text(`✗ ${message}`).css("color", "red");
          });
      });
    },
  });
</script>

<script type="text/html" data-template-name="cookidoo-config">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-config-input-localization"><i class="fa fa-globe"></i> Localization</label>
    <select id="node-config-input-localization" style="width:70%"></select>
    <input type="hidden" id="node-config-input-countryCode" />
    <input type="hidden" id="node-config-input-language" />
    <input type="hidden" id="node-config-input-localizationUrl" />
  </div>
  <div class="form-row">
    <label for="node-config-input-email"><i class="fa fa-user"></i> Email</label>
    <input type="text" id="node-config-input-email" placeholder="you@example.com" />
  </div>
  <div class="form-row">
    <label for="node-config-input-login-password"><i class="fa fa-lock"></i> Password</label>
    <input type="password" id="node-config-input-login-password" placeholder="only used to log in, never stored" />
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <button type="button" id="node-config-login-button" class="red-ui-button">Login</button>
    <span id="node-config-login-status" style="margin-left: 10px;"></span>
  </div>
</script>

<script type="text/html" data-help-name="cookidoo-config">
  <p>Holds the Cookidoo localization (country/language) and OAuth2 tokens shared by all Cookidoo nodes in a flow.</p>
  <p>Enter the account email/password and click <b>Login</b> to run the official Cookidoo OAuth2/PKCE flow once. Only the resulting access/refresh tokens are stored as this node's credentials -- the password itself is never persisted, and the token is refreshed automatically (rotating what's stored) as it's used.</p>
  <p><b>Click Deploy after logging in.</b> The tokens take effect immediately, but -- like all Node-RED node credentials -- they are only written to disk as part of a Deploy. Without one, they're lost the next time Node-RED restarts and you'll need to log in again. This also applies to a background token refresh that happens to rotate the tokens between deploys.</p>
</script>
