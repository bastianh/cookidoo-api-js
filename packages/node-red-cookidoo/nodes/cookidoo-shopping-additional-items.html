<script type="text/javascript">
  RED.nodes.registerType("cookidoo-shopping-additional-items", {
    category: "cookidoo",
    color: "#f2c12e",
    defaults: {
      name: { value: "" },
      cookidoo: { value: "", type: "cookidoo-config", required: true },
      operation: { value: "get", required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-list-ul",
    label: function () {
      return this.name || `additional items: ${this.operation}`;
    },
  });
</script>

<script type="text/html" data-template-name="cookidoo-shopping-additional-items">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-cookidoo"><i class="fa fa-cog"></i> Cookidoo</label>
    <input type="text" id="node-input-cookidoo" />
  </div>
  <div class="form-row">
    <label for="node-input-operation"><i class="fa fa-wrench"></i> Operation</label>
    <select id="node-input-operation" style="width:70%">
      <option value="get">get additional items</option>
      <option value="add">add additional items</option>
      <option value="edit">edit additional items (name)</option>
      <option value="edit-ownership">edit additional items ownership</option>
      <option value="remove">remove additional items</option>
    </select>
  </div>
  <div class="form-tips">
    Overridable per message with <code>msg.operation</code>. See the node's help for the expected <code>msg.payload</code> per operation.
  </div>
</script>

<script type="text/html" data-help-name="cookidoo-shopping-additional-items">
  <p>Shopping-list operations for additional (not recipe-linked) items. The operation can be set here or overridden per message with <code>msg.operation</code>.</p>
  <table class="cookidoo-op-table" style="width:100%">
    <tr><th align="left">Operation</th><th align="left"><code>msg.payload</code> in</th><th align="left"><code>msg.payload</code> out</th></tr>
    <tr><td><code>get</code></td><td>-</td><td><code>CookidooAdditionalItem[]</code></td></tr>
    <tr><td><code>add</code></td><td>item name <code>string[]</code></td><td><code>CookidooAdditionalItem[]</code> (always <code>isOwned: false</code>)</td></tr>
    <tr><td><code>edit</code></td><td><code>CookidooAdditionalItem[]</code> (with the desired <code>name</code>)</td><td>the edited <code>CookidooAdditionalItem[]</code></td></tr>
    <tr><td><code>edit-ownership</code></td><td><code>CookidooAdditionalItem[]</code> (with the desired <code>isOwned</code>)</td><td>the edited <code>CookidooAdditionalItem[]</code></td></tr>
    <tr><td><code>remove</code></td><td>item id <code>string[]</code></td><td>-</td></tr>
  </table>
  <p>New items are always added unowned; chain <code>add</code> with an immediate <code>edit-ownership</code> if you need them owned right away.</p>
</script>
