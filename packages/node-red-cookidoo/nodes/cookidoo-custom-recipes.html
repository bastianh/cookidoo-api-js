<script type="text/javascript">
  RED.nodes.registerType("cookidoo-custom-recipes", {
    category: "cookidoo",
    color: "#f2c12e",
    defaults: {
      name: { value: "" },
      cookidoo: { value: "", type: "cookidoo-config", required: true },
      operation: { value: "list", required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-cutlery",
    label: function () {
      return this.name || `custom recipes: ${this.operation}`;
    },
  });
</script>

<script type="text/html" data-template-name="cookidoo-custom-recipes">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-cookidoo"><i class="fa fa-cog"></i> Cookidoo</label>
    <input type="text" id="node-input-cookidoo" />
  </div>
  <div class="form-row">
    <label for="node-input-operation"><i class="fa fa-wrench"></i> Operation</label>
    <select id="node-input-operation" style="width:70%">
      <option value="list">list custom recipes</option>
      <option value="get">get custom recipe</option>
      <option value="add-from">add custom recipe from an official one</option>
      <option value="remove">remove custom recipe</option>
    </select>
  </div>
  <div class="form-tips">
    Overridable per message with <code>msg.operation</code>. See the node's help for the expected <code>msg.payload</code> per operation.
  </div>
</script>

<script type="text/html" data-help-name="cookidoo-custom-recipes">
  <p>CRUD operations on the signed-in user's custom recipes. The operation can be set here or overridden per message with <code>msg.operation</code>.</p>
  <table class="cookidoo-op-table" style="width:100%">
    <tr><th align="left">Operation</th><th align="left"><code>msg.payload</code> in</th><th align="left"><code>msg.payload</code> out</th></tr>
    <tr><td><code>list</code></td><td>-</td><td><code>CookidooCustomRecipe[]</code></td></tr>
    <tr><td><code>get</code></td><td>custom recipe id (<code>string</code>)</td><td><code>CookidooCustomRecipe</code></td></tr>
    <tr><td><code>add-from</code></td><td><code>{ recipeId, servingSize }</code> (the official recipe to copy)</td><td>the new <code>CookidooCustomRecipe</code></td></tr>
    <tr><td><code>remove</code></td><td>custom recipe id (<code>string</code>)</td><td>-</td></tr>
  </table>
  <p>Typical flow: <b>cookidoo-search-recipes</b> or <b>cookidoo-get-recipe-details</b> &rarr; take its <code>id</code> &rarr; <code>add-from</code>.</p>
</script>
