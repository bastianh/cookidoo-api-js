<script type="text/javascript">
  RED.nodes.registerType("cookidoo-get-user-info", {
    category: "cookidoo",
    color: "#f2c12e",
    defaults: {
      name: { value: "" },
      cookidoo: { value: "", type: "cookidoo-config", required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-user",
    label: function () {
      return this.name || "get user info";
    },
  });
</script>

<script type="text/html" data-template-name="cookidoo-get-user-info">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-cookidoo"><i class="fa fa-cog"></i> Cookidoo</label>
    <input type="text" id="node-input-cookidoo" />
  </div>
</script>

<script type="text/html" data-help-name="cookidoo-get-user-info">
  <p>Fetches the signed-in user's Cookidoo profile (id, username, description, picture) on every input message and sets it as <code>msg.payload</code>.</p>
</script>
